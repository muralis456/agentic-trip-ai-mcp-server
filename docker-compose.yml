secrets:
  vault_role_id:
    file: ../vault/credentials/agentic-trip-ai-mcp-role-id
  vault_secret_id:
    file: ../vault/credentials/agentic-trip-ai-mcp-secret-id

services:
  postgres:
    image: postgres:17
    container_name: agentic-trip-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MCP_DB_PASSWORD:-postgres}
    volumes:
      - mcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-trip-ai-mcp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    secrets:
      - vault_role_id
      - vault_secret_id
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VAULT_URI: ${VAULT_URI:-http://host.docker.internal:8200}

      MCP_SERVER_PORT: "8090"
      MCP_DB_URL: jdbc:postgresql://postgres:5432/travel_agent
      MCP_DB_USERNAME: postgres
      MCP_SERVER_PROTOCOL: STATELESS

      MCP_SECURITY_ENABLED: ${MCP_SECURITY_ENABLED:-false}
      MCP_API_KEY: ${MCP_API_KEY:-}
      AVIATIONSTACK_ENABLED: ${AVIATIONSTACK_ENABLED:-true}
      IGNAV_ENABLED: ${IGNAV_ENABLED:-true}
      SERPAPI_ENABLED: ${SERPAPI_ENABLED:-true}
      JETTOVA_ENABLED: ${JETTOVA_ENABLED:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mcp-postgres-data:
