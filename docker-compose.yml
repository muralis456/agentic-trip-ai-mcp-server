services:
  postgres:
    image: postgres:17
    container_name: agentic-trip-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: travel_app
      POSTGRES_PASSWORD: ${MCP_DB_PASSWORD:-travel_app_local}
    volumes:
      - mcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_app -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-trip-ai-mcp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      MCP_SERVER_PORT: "8090"
      MCP_DB_URL: jdbc:postgresql://postgres:5432/travel_agent
      MCP_DB_USERNAME: travel_app
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-travel_app_local}
      MCP_SERVER_PROTOCOL: STATELESS
      MCP_SECURITY_ENABLED: ${MCP_SECURITY_ENABLED:-false}
      MCP_API_KEY: ${MCP_API_KEY:-}
      AVIATIONSTACK_ENABLED: ${AVIATIONSTACK_ENABLED:-true}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      IGNAV_ENABLED: ${IGNAV_ENABLED:-true}
      IGNAV_API_KEY: ${IGNAV_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      SERPAPI_ENABLED: ${SERPAPI_ENABLED:-true}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      JETTOVA_ENABLED: ${JETTOVA_ENABLED:-true}
      JETTOVA_API_KEY: ${JETTOVA_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mcp-postgres-data:
